<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu sorpresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--wall:#141a16;--wall2:#090c0a;--cream:#cfc9a8;--orange:#7d4a2a;--gold:#a8944a;--ink:#050706;--paper:#b4ae97}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--cream);font-family:'Press Start 2P',monospace;overflow:hidden}

/*  ============ Si tocan esta onda adios adios  ============ */
.page{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:4vh 5vw 26vh;text-align:center;
 background:radial-gradient(ellipse at 50% 35%,#1d2620,var(--wall2) 72%);filter:saturate(.6) contrast(1.12)}
.page.on{display:flex;animation:in .5s ease,flick 6s 1s infinite}
.page::before{content:"";position:absolute;left:0;right:0;top:48%;height:5vh;
 background:repeating-conic-gradient(#d9d3c2 0 25%,#1b2530 0 50%) 0 0/5vh 5vh;opacity:.35}
.page::after{content:"";position:absolute;left:-30%;right:-30%;bottom:0;height:30vh;
 background:repeating-conic-gradient(#cfc8b6 0 25%,#151c24 0 50%) 0 0/9vh 9vh;
 transform:perspective(40vh) rotateX(55deg);transform-origin:bottom;opacity:.55;
 -webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.page>*{position:relative;z-index:1}
h1{font-size:clamp(18px,5.4vw,40px);line-height:1.5;color:var(--cream);text-shadow:3px 3px 0 #000;animation:glitch 7s steps(1) infinite}
h2{font-size:clamp(12px,3.4vw,22px);line-height:1.7;color:var(--gold);text-shadow:2px 2px 0 #000}
p,.sub{font-family:'VT323',monospace;font-size:clamp(19px,4.6vw,26px);line-height:1.15}
.btn{font:inherit;font-size:clamp(11px,3vw,16px);padding:1.4em 2.2em;border:3px solid var(--cream);background:#0008;color:var(--cream);border-radius:40px;cursor:pointer;transition:.15s}
.btn:hover,.btn:focus-visible{background:var(--cream);color:var(--ink);transform:scale(1.06);outline:none}
.next{position:absolute!important;right:4vw;bottom:5vh;z-index:5}
.back{position:absolute!important;left:4vw;bottom:5vh;z-index:5;padding:1.4em 1.6em}

#count{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#14100e,#050706 75%)}
#count.on{display:flex}
#count b{font-size:min(46vw,46vh);color:var(--cream);text-shadow:6px 6px 0 #000;animation:cnt .95s ease-out both}

.row{display:flex;gap:2vw;justify-content:center;align-items:flex-end;width:100%}
.pick{background:none;border:0;cursor:pointer;color:var(--cream);font:inherit;font-size:clamp(8px,2.2vw,12px);display:flex;flex-direction:column;align-items:center;gap:1vh;width:22vw;max-width:230px}
.pick img{width:100%;aspect-ratio:1;object-fit:contain;transition:.2s;filter:drop-shadow(0 6px 0 #0006)}
.pick:hover img,.pick:focus-visible img{transform:translateY(-1.5vh) scale(1.08) rotate(-3deg)}
.pick.done{opacity:.55}.pick.done span::after{content:" ✓"}

#p2{justify-content:flex-start;padding-top:11vh}
.portada{max-width:50vw;max-height:46vh;object-fit:contain;filter:drop-shadow(0 8px 10px #000a)}
.grp{position:absolute!important;inset:0;z-index:2!important;pointer-events:none;overflow:hidden}
.g{position:absolute;display:flex;align-items:flex-end;filter:drop-shadow(0 8px 6px #000a);animation:sway 4s ease-in-out infinite alternate}
.g img{height:100%;width:auto;display:block;object-fit:contain}
.g1{left:1%;bottom:5vh;height:78vh;rotate:4deg}
.g2{left:21%;bottom:3vh;height:39vh;rotate:-5deg;animation-delay:-1.3s}
.g3{right:0;transform:translateX(16%);bottom:9vh;height:78vh;rotate:-8deg;animation-delay:-2.2s}

.msgs{display:grid;grid-template-columns:1fr minmax(30vw,400px) 1fr;gap:2vw;align-items:center;width:100%;max-width:1100px}
.col{display:flex;flex-direction:column;gap:1.6vh}
.pill{background:var(--paper);color:#22303c;font-family:'VT323',monospace;font-size:clamp(17px,4.2vw,24px);padding:1.2vh 2vw;border-radius:30px;border:3px solid #0008;text-align:center;opacity:0;transform:scale(.6)}
.pill.show{opacity:1;transform:scale(1);transition:.35s cubic-bezier(.3,1.6,.5,1)}
.mid{position:absolute!important;left:50%;bottom:5vh;height:76vh;translate:-50% 0;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;z-index:2;pointer-events:none}
.mid img{width:auto;height:100%;max-width:50vw;filter:drop-shadow(0 10px 8px #000c)}
.mid.in{animation:grow 1.4s ease-out 1}

.card{background:var(--paper);color:#22303c;border-radius:18px;padding:3vh 4vw;max-width:680px;max-height:48vh;overflow:auto;border:4px solid #0008}
.card p{font-size:clamp(18px,4.3vw,25px)}
.player{background:#2a1a12cc;border:3px solid #0008;border-radius:16px;padding:2vh 3vw;width:100%;max-width:560px;text-align:left;display:flex;flex-direction:column;gap:1vh}
.song{display:flex;gap:2vw;align-items:center;background:none;border:0;color:var(--cream);font-family:'VT323',monospace;font-size:clamp(18px,4.4vw,24px);padding:.6vh 1vw;cursor:pointer;text-align:left;border-radius:8px}
.song:hover,.song.play{background:#ffffff1f}
.song small{opacity:.7;font-size:.8em}
iframe{border:0;border-radius:12px}
.duo{display:flex;gap:3vw;align-items:flex-start;justify-content:center;width:100%;max-width:1560px}
.duo .player,.duo .card{flex:1;max-width:none;min-width:0}
.duo iframe{flex:0 0 min(30vw,540px);height:min(400px,48vh)}
.trio{display:flex;gap:2.5vw;align-items:center;justify-content:center;width:100%;max-width:1300px}
.trio .card{flex:1;min-width:0;max-width:none;max-height:44vh}
.slot{flex:0 0 min(34vw,430px)}
.duo .slot{flex-basis:min(26vw,480px)}
#p4 h2{z-index:6}
.stand,.sit{position:absolute!important;left:50%;bottom:2vh;translate:-50% 0;z-index:5!important;filter:drop-shadow(0 10px 8px #000c);pointer-events:none}
.stand{height:var(--h,72vh)}
.sit{height:46vh}
.stand img,.sit img{height:100%;width:auto;display:block;object-fit:contain;object-position:50% 100%}
.stand img{max-width:40vw}
.sit img{max-width:38vw}
.stand::after,.sit::after,.mid::after{content:"";position:absolute;left:6%;right:6%;bottom:-2%;height:8%;background:radial-gradient(ellipse,#000c,transparent 70%);z-index:-1}

.wall{position:relative;width:min(96vw,940px);height:min(58vh,72vw)}
.pol{position:absolute;width:24%;aspect-ratio:3/4;background:var(--orange);box-shadow:4px 6px 0 #0007;transition:.25s;rotate:var(--r)}
.pol:hover{scale:1.15;rotate:0deg;z-index:9}
.pol img,.pol .ph{position:absolute;left:2.5%;top:2.5%;width:95%;height:88%;object-fit:cover;background:#22303c;display:flex;align-items:center;justify-content:center;font-size:30px}
.face{position:absolute;width:15%;aspect-ratio:1;z-index:6;rotate:var(--r);filter:drop-shadow(3px 5px 4px #000c)}
.face img{width:100%;height:100%;object-fit:contain}

.mascot{width:min(50vw,320px);animation:bob 2.4s ease-in-out infinite}
.mascot img{width:100%;aspect-ratio:1;object-fit:contain}

.decor{position:absolute!important;inset:0;z-index:0!important;overflow:hidden;pointer-events:none}
.decor .d{position:absolute;opacity:.85}
.decor svg{width:100%;height:auto;display:block;overflow:visible}
.sw{transform-origin:20% 10%;animation:camsw 7s ease-in-out infinite alternate}
.led{animation:led 1.4s steps(1) infinite}
.plate{font:clamp(8px,1.6vw,12px) 'Press Start 2P',monospace;color:#1a170c;background:#9c8a3c;padding:.9em 1.2em;border:3px solid #1a170c;box-shadow:inset 0 0 0 2px #b9a44a55,3px 4px 0 #0008;text-align:center;white-space:nowrap}

.fl{position:absolute!important;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.sil{position:absolute;isolation:isolate;height:var(--h);filter:drop-shadow(0 10px 8px #000c)}
.sil img{display:block;height:100%;width:auto}
.sil img.gl{position:absolute;left:0;top:0}
.gl{mix-blend-mode:screen;filter:brightness(.92) contrast(14) blur(2.5px)}
.ventw{position:relative;isolation:isolate;background:#050605;aspect-ratio:4/3}
.ventw img{position:absolute;left:6%;top:6%;width:88%;height:88%;object-fit:cover;filter:brightness(.9)}
.ventw svg{position:relative;display:block;width:100%;height:100%}
.gatew{position:relative;isolation:isolate}
.gatew img{position:absolute;left:5%;top:47%;width:90%;height:51%;object-fit:contain;object-position:50% 100%}
.ventw img.gl,.gatew img.gl{filter:brightness(.92) contrast(14) blur(2.5px)}

body::before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 animation:grain .5s steps(1) infinite}
body::after{content:"";position:fixed;inset:0;z-index:51;pointer-events:none;
 background:repeating-linear-gradient(transparent 0 2px,#0005 3px),radial-gradient(ellipse at center,transparent 45%,#000d 100%)}
#hud{position:fixed;left:4vw;right:4vw;top:2.5vh;z-index:52;display:flex;justify-content:space-between;font:clamp(16px,3.6vw,22px) 'VT323',monospace;color:#d8d3b4;text-shadow:0 0 6px #0008;pointer-events:none}
#hud b{color:#b3382c;animation:rec 1.2s steps(1) infinite}


@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes flick{0%,100%{opacity:1}91%{opacity:1}92%{opacity:.78}93%{opacity:1}96%{opacity:.9}97%{opacity:1}}
@keyframes grain{0%{background-position:0 0}25%{background-position:-40px 30px}50%{background-position:30px -50px}75%{background-position:-20px -30px}}
@keyframes rec{50%{opacity:0}}
@keyframes glitch{0%,95%,100%{text-shadow:3px 3px 0 #000}96%{text-shadow:-4px 0 #8a2a2a,4px 0 #2a6a6a}98%{text-shadow:4px 0 #8a2a2a,-4px 0 #2a6a6a;transform:translateX(3px)}}
@keyframes cnt{0%{transform:scale(1.5);opacity:0;filter:blur(6px)}25%{opacity:1;filter:none}100%{transform:scale(.92);opacity:.5}}
@keyframes bob{50%{transform:translateY(-1.2vh) rotate(2deg)}}
@keyframes sway{to{translate:0 -.8vh;scale:1.02}}
@keyframes grow{0%{scale:.82}45%{scale:1.07}100%{scale:1}}
@keyframes camsw{from{rotate:-14deg}to{rotate:12deg}}
@keyframes led{50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

@media(max-width:700px){
 .duo{flex-direction:column;align-items:center}.duo .card{max-height:24vh}.duo iframe{flex:none;width:100%;height:min(352px,34vh)}
 .trio{flex-direction:column}.trio .card{max-height:20vh}
 .slot{display:none}
 .wall{height:min(58vh,92vw)}.pol{width:29%}
 .sit{height:34vh}.sit img{max-width:52vw}
 .stand{height:38vh;left:4vw;translate:0 0}.stand img{max-width:40vw}
 .g1,.g3{height:46vh}.g2{height:23vh;left:22%}
 .portada{max-width:92vw}
 .sil{height:calc(var(--h)*.62)}
}
@media(max-width:560px){
 .pick{width:23vw}
 .pill{font-size:15px;padding:.8vh 1.2vw;border-width:2px}
 .msgs{grid-template-columns:1fr 38vw 1fr}
 .mid{height:58vh}.mid img{max-width:42vw}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="sh" cx=".32" cy=".28" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient></defs></svg>
<div id="hud"><span><b>● REC</b> &nbsp;CAM <span id="cam">01</span></span><span id="ts">00:00:00</span></div>
<div id="count"><b>3</b></div>

<!--NO TOCAR — de aquí hasta </script> está la estructura de las pantallas: cada bloque es una pantalla y los números sirven para saltar de una a otra sino vale verga este pedo. -->
<!-- 0 inicio -->
<section class="page on" id="p0">
  <h1>Hola mi amor</h1>
  <p class="sub">¿Quieres ver tu sorpresa?</p>
  <button class="btn" onclick="countdown()">Sí</button>
</section>
<!-- 1 elegir -->
<section class="page" id="p1">
  <h1>Sorpresa mi amor</h1>
  <p class="sub">Abre cada uno, uno por uno</p>
  <div class="row" id="picks"></div>
  <button class="btn next" id="c1" style="display:none" onclick="go(7)">Continuar</button>
</section>
<!-- 2 portada -->
<section class="page" id="p2">
  <img class="portada" id="portadaImg" alt="">
  <div class="grp" id="grp"></div>
  <button class="btn next" onclick="go(1)">Continuar</button>
</section>
<!-- 3 todo esto es para ti -->
<section class="page" id="p3">
  <h1 id="t3" class="ty"></h1>
  <div class="msgs"><div class="col" id="mL"></div><div></div><div class="col" id="mR"></div></div>
  <div class="mid" id="mMid"></div>
  <button class="btn next" onclick="go(1)">Volver</button>
</section>
<!-- 4 te dedico esto -->
<section class="page" id="p4">
  <h2 class="ty">Te dedico esto</h2>
  <div class="trio"><div class="card" id="dedic"></div><div class="slot"></div><div class="card" id="dedicB"></div></div>
  <div class="stand" id="standDedica" style="--h:82vh"></div>
  <button class="btn next" onclick="go(1)">Volver</button>
</section>
<!-- 5 playlist -->
<section class="page" id="p5">
  <h2 class="ty">Nuestra playlist</h2>
  <div class="duo"><div class="player" id="player"></div><div class="slot"></div><div class="card" id="dedic2"></div></div>
  <div class="stand" id="standPlay"></div>
  <audio id="au"></audio>
  <button class="btn next" onclick="go(1)">Volver</button>
</section>
<!-- 6 fotos -->
<section class="page" id="p6">
  <h2 class="ty">Nuestras fotos</h2>
  <div class="wall" id="wall"></div>
  <div class="sit" id="sit"></div>
  <button class="btn next" onclick="go(1)">Volver</button>
</section>
<!-- 7 final -->
<section class="page" id="p7">
  <div class="mascot" id="end"></div>
  <h1 id="fin"></h1>
  <button class="btn" onclick="go(0)">Verla otra vez</button>
</section>

<script>
/*  ============ AQUÍ SÍ SE PUEDE EDITAR: textos, imágenes y sonidos (los archivos van en la misma carpeta que este) ============ */
const CONFIG = {
  portadaImg: "logo.png",         // imagen de la portada (la pantalla que sale después del 3, 2, 1)
  grupo: [{img:"culero.png"},{img:"cerote.png"},{img:"cabal.png"}],   // portada: 1 alto izquierda | 2 pequeño | 3 asoma por la derecha
  imgCentro: "frifro.png",        // peluche 1: personaje en medio de los mensajes
  imgPlaylist: "foxeso.png",      // peluche 2: personaje de pie junto a la playlist
  imgFotos: "sentao.png",         // peluche 3: personaje sentado en el suelo
  rostros: ["ros1.png",""],       // peluche 3: rostros entre las fotos (el vacío no se muestra)
  imgDedica: "sirSexo.png",       // peluche 4: personaje de pie entre los textos
  silParado: "sil1.png",          // silueta de pie
  silSentado: "sil2.png",         // silueta sentada
  silRejilla: "sil3.png",         // silueta en rejillas y portones oscuros
  sonidoBoton: "clic.mp3",       // sonido al presionar cualquier botón ("" para quitarlo)
  volumenBoton: 0.6,              // 0 a 1
  personajes: [
    {nombre:"Personaje 1", img:"Bonnie.png"},
    {nombre:"Personaje 2", img:"chica.png"},
    {nombre:"Personaje 3", img:"Foxy.png"},
    {nombre:"Personaje 4", img:"Fredy.png"}
  ],
  titulo_mensajes: "Todo esto es para ti, amor",
  mensajes: [                     // Las frases 
    "Te amo mucho","Me encantas","Eres mi persona favorita","Contigo todo es más fácil",
    "Me haces reír siempre","Me gusta cómo eres conmigo","Eres mi lugar seguro","Gracias por cuidarme",
    "Me siento muy afortunada","Hasta tus manías me gustan"
  ],
  dedicatoria: "Hice esta sorpresa pensando en ti. Quería regalarte algo diferente, algo que no se pudiera comprar en una tienda. Cada detalle está puesto con cariño, y espero que te saque una sonrisa.",
  dedicatoria2: "Gracias por tu paciencia, por tus abrazos y por hacerme reír hasta cuando estoy de mal humor. Contigo me siento tranquila y muy yo. Esto es mi forma de decirte que te quiero y que me haces muy feliz.",
  cartaPlaylist: "Armé esta playlist con canciones que me hacen pensar en ti. Algunas me recuerdan momentos nuestros y otras solo suenan a ti. Quise juntarlas en un solo lugar, para que cuando las escuches sepas cuánto pienso en ti.",

  spotify: "https://open.spotify.com/embed/playlist/29F9CMTmvxYBL1nF7N5Vl5",   //la playlist kwai
  fotos: ["one.jpeg","two.jpeg","three.jpeg","four.jpeg","five.jpeg"],
  final: "Gracias por ser tú. Te amo"
};
/* Hasta aqui si pueden joder lo qeu quieran a su gusto con precaucion  */

const $=s=>document.querySelector(s);
const img=(src,alt)=>src?`<img src="${src}" alt="${alt||''}" onerror="this.remove()">`:'';
const pages=[...document.querySelectorAll('.page')];
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=0;

/* los efectos en las letritas ugu */
function typeEl(el,speed,delay){
  if(!el)return;
  const full=el.dataset.full||(el.dataset.full=el.textContent);
  clearInterval(el._t);clearTimeout(el._d);
  if(REDUCED){el.textContent=full;return}
  el.innerHTML='<span></span><span style="visibility:hidden"></span>';
  const [a,b]=el.children;b.textContent=full;let k=0;
  el._d=setTimeout(()=>{el._t=setInterval(()=>{k++;a.textContent=full.slice(0,k);b.textContent=full.slice(k);if(k>=full.length)clearInterval(el._t)},speed)},delay||0);
}
function startType(n){
  if(n<3||n>6)return;
  document.querySelectorAll(`#p${n} h1.ty,#p${n} h2.ty`).forEach(e=>typeEl(e,45,100));
  document.querySelectorAll(`#p${n} .card .ty`).forEach(e=>typeEl(e,22,1100));
}

/* Esta funcion decide que se va a mostrar si no se pone loca  */
function go(n){
  $('#cam').textContent=String(n+1).padStart(2,'0');
  pages[cur].classList.remove('on');cur=n;pages[cur].classList.add('on');
  if(n===3)revealPills(); if(n===6)layoutPhotos(); startType(n);
  if(n!==5){$('#au').pause();document.querySelectorAll('.song.play').forEach(b=>b.classList.remove('play'))}
}
function countdown(){
  const c=$('#count'),b=c.querySelector('b');c.classList.add('on');let n=3;
  (function t(){
    if(n===0){c.classList.remove('on');go(2);return}
    b.textContent=n;b.style.animation='none';void b.offsetWidth;b.style.animation='';n--;setTimeout(t,950);
  })();
}

/* el pinshi sonido del boton*/
const clk=CONFIG.sonidoBoton?new Audio(CONFIG.sonidoBoton):null;
document.addEventListener('click',e=>{
  if(!clk||!e.target.closest('button')||e.target.closest('.song'))return;
  const a=clk.cloneNode();a.volume=CONFIG.volumenBoton;
  const p=a.play();if(p)p.catch(()=>{});
});

/* Si tocan algo y no le saben van a dejar todas las pantallas vacias  */
setInterval(()=>{$('#ts').textContent=new Date().toLocaleTimeString('es',{hour12:false})},1000);
$('#picks').innerHTML=CONFIG.personajes.map((p,i)=>`<button class="pick" data-i="${i}">${img(p.img,p.nombre)}<span>${p.nombre}</span></button>`).join('');
const opened=new Set();
const SECCION=[3,5,6,4]; 
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i;opened.add(i);b.classList.add('done');
  $('#end').innerHTML=img(CONFIG.personajes[i].img,CONFIG.personajes[i].nombre);
  if(opened.size>=CONFIG.personajes.length)$('#c1').style.display='';
  go(SECCION[i]);
});
pages[2].insertAdjacentHTML('beforeend','<button class="btn back" aria-label="Atrás" onclick="go(0)">‹</button>');

/* la pinshi portada */
const ci=$('#portadaImg');
if(CONFIG.portadaImg){ci.src=CONFIG.portadaImg;ci.onerror=()=>ci.remove()}else ci.remove();
$('#grp').innerHTML=CONFIG.grupo.slice(0,3).map((g,i)=>`<div class="g g${i+1}">${img(g.img)}</div>`).join('');

/* los mensajes kwai  */
$('#t3').textContent=CONFIG.titulo_mensajes;
const half=Math.ceil(CONFIG.mensajes.length/2);
const pillsHTML=(arr,side)=>arr.map((m,j)=>`<div class="pill" data-o="${j*2+side}"><span class="pt">${m}</span></div>`).join('');
$('#mL').innerHTML=pillsHTML(CONFIG.mensajes.slice(0,half),0);
$('#mR').innerHTML=pillsHTML(CONFIG.mensajes.slice(half),1);
$('#mMid').innerHTML=img(CONFIG.imgCentro);
function revealPills(){
  const mid=$('#mMid');mid.classList.remove('in');void mid.offsetWidth;mid.classList.add('in');
  document.querySelectorAll('.pill').forEach(p=>{
    p.classList.remove('show');const d=900+(+p.dataset.o)*330;
    typeEl(p.querySelector('.pt'),24,d);
    setTimeout(()=>p.classList.add('show'),d);
  });
}

/*las cartas y personajes de pie no tocar si no sabe*/

(function(){

function layoutPhotos(){
  const w=$('#wall');if(w.dataset.done)return;w.dataset.done=1;
  const P=[[10,2,-6],[12,47,5],[67,0,6],[64,48,-5],[38.5,0,-2]];   // [izq%, arriba%, rotación]
  const F=[[29,30,-6],[58,32,7],[7,76,5],[80,76,-5]];
  w.innerHTML=CONFIG.fotos.slice(0,5).map((f,i)=>{const [x,y,r]=P[i];
    return `<div class="pol" style="left:${x}%;top:${y}%;--r:${r}deg"><img src="${f}" alt="" onerror="this.outerHTML='<div class=ph>💖</div>'"></div>`}).join('')
  +CONFIG.rostros.slice(0,4).map((f,i)=>{const [x,y,r]=F[i];

}
